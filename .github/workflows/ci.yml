name: SDK checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check the SDK contract copy
        run: python3 scripts/update_contract.py --check

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run the scenarios and tests
        run: npm test

      - name: Build the package
        run: npm pack --dry-run
