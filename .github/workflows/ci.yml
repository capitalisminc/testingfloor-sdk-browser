name: SDK checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22.18.0', '24', '26']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Check the SDK contract copy
        run: python3 scripts/update_contract.py --check

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run the scenarios and tests
        run: npm test

      - name: Check the packed package
        run: npm run test:package

  runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 'v2.x'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check Bun, Deno, Chromium, and Web Worker consumers
        run: npm run test:browser
